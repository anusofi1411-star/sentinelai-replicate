<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SentinelAI-X — Secure Access Sign In</title>
<meta name="description" content="Sign in to SentinelAI-X, the distributed laboratory security system. Detect. Analyze. Protect." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page">
    <div class="glow glow-blue" aria-hidden="true"></div>
    <div class="glow glow-pink" aria-hidden="true"></div>

    <!-- LEFT: branding -->
    <section class="brand">
      <img class="brand-logo" src="https://id-preview--7a510902-82c3-41d9-b497-07f683c4521d.lovable.app/__l5e/assets-v1/2dc38579-6e32-44b3-85e3-fe20e5f06cba/sentinel-logo-v4.png" alt="SentinelAI-X — Distributed Laboratory Security System" />
      <p class="tagline">&ldquo;The Intelligence Behind Laboratory Security.&rdquo;</p>
      <p class="slogan">
        <span class="s-blue">DETECT.</span>
        <span class="s-violet">ANALYZE.</span>
        <span class="s-pink">PROTECT.</span>
      </p>
      <img class="brand-illustration" src="https://id-preview--7a510902-82c3-41d9-b497-07f683c4521d.lovable.app/__l5e/assets-v1/2e7adacc-f2e3-4bff-8378-17da43291493/lab-network-v4.png" alt="Distributed laboratory network with LAB 01 to LAB 04 nodes connected to a central secured server" />
    </section>

    <!-- RIGHT: login card -->
    <section class="card-wrap">
      <div class="login-card">
        <div class="shield" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </div>

        <p class="secure-access">SECURE ACCESS</p>
        <div class="divider"></div>

        <h1 class="title">Sign In</h1>
        <p class="subtitle">Access your laboratory security dashboard</p>

        <form id="login-form" novalidate>
          <div class="group">
            <label for="email">Email Address</label>
            <div class="field">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/>
              </svg>
              <input id="email" name="email" type="email" placeholder="Enter your email" autocomplete="email" maxlength="255" required />
            </div>
          </div>

          <div class="group">
            <label for="password">Password</label>
            <div class="field">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
              <input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" maxlength="128" required />
              <button type="button" id="toggle-password" class="eye" aria-label="Show password">
                <svg id="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>
                </svg>
                <svg id="eye-closed" class="hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M10.7 5.1A10.9 10.9 0 0 1 12 5c6.4 0 10 7 10 7a17.8 17.8 0 0 1-2.2 3.1M6.6 6.6A17.6 17.6 0 0 0 2 12s3.6 7 10 7a10.8 10.8 0 0 0 4.2-.8"/><path d="m2 2 20 20"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>
                </svg>
              </button>
            </div>
          </div>

          <div class="forgot-row">
            <a href="#" class="forgot">Forgot Password?</a>
          </div>

          <p id="form-error" class="error hidden"></p>

          <button type="submit" id="submit-btn" class="btn">
            <span id="submit-label">Login</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>
            </svg>
          </button>
        </form>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
